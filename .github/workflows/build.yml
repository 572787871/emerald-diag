name: Build EmeraldSDHC (ioreg diagnostics)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Fetch sources
        run: |
          git clone --depth 1 https://github.com/acidanthera/EmeraldSDHC.git repo
          git clone --depth 1 https://github.com/acidanthera/MacKernelSDK.git repo/MacKernelSDK

      - name: Apply diagnostics patch
        run: |
          cat > /tmp/diag.diff <<'PATCH_EOF'
          diff --git a/EmeraldSDHC/EmeraldSDHCBlockStorageDevice.hpp b/EmeraldSDHC/EmeraldSDHCBlockStorageDevice.hpp
          index fe9234e..7561b60 100644
          --- a/EmeraldSDHC/EmeraldSDHCBlockStorageDevice.hpp
          +++ b/EmeraldSDHC/EmeraldSDHCBlockStorageDevice.hpp
          @@ -149,6 +149,8 @@ private:
             bool switchMMCSpeed();
             bool tuneCard(SDABusWidth busWidth);
             bool setMMCSpeed(MMCTimingSpeed speed);
          +  bool switchMMCHS400();
          +  bool verifyMMCMode(MMCTimingSpeed expected);
             bool initCard();
           
             //
          diff --git a/EmeraldSDHC/EmeraldSDHCBlockStorageDeviceCard.cpp b/EmeraldSDHC/EmeraldSDHCBlockStorageDeviceCard.cpp
          index c420ea4..ce2f212 100644
          --- a/EmeraldSDHC/EmeraldSDHCBlockStorageDeviceCard.cpp
          +++ b/EmeraldSDHC/EmeraldSDHCBlockStorageDeviceCard.cpp
          @@ -519,32 +519,14 @@ bool EmeraldSDHCBlockStorageDevice::switchMMCExtendedCSD(MMCSwitchAccessBits acc
           }
           
           bool EmeraldSDHCBlockStorageDevice::switchMMCSpeed() {
          -  /*SDABusWidth busWidth;
          -  MMCTimingSpeed speed;
          -
          -  //
          -  // Set speed to max supported.
          -  //
          -  if (_mmcExtendedCSD.deviceType & (kMMCDeviceTypeHS400_DDR_1_2V | kMMCDeviceTypeHS400_DDR_1_8V)) {
          -    busWidth = kSDABusWidth8;
          -    speed = kMMCTimingSpeedHS200;
          -  } else if (_mmcExtendedCSD.deviceType & (kMMCDeviceTypeHS200_SDR_1_2V | kMMCDeviceTypeHS200_SDR_1_8V)) {
          -    busWidth = kSDABusWidth8;
          -    speed = kMMCTimingSpeedHS200;
          -  } else if (_mmcExtendedCSD.deviceType & (kMMCDeviceTypeHighSpeed_DDR_52MHz_1_2V | kMMCDeviceTypeHighSpeed_DDR_52MHz_1_8V_3V)) {
          -    
          -  }*/
          -
          -  setCardBusWidth(kSDABusWidth8, false);
          -
          -  setMMCSpeed(kMMCTimingSpeedHS200);
          -  _cardSlot->setControllerClock(200 * MHz);
          -  
          -  tuneCard(kSDABusWidth8);
          -
          -  
             UInt64 hostCaps = _cardSlot->getControllerCapabilities();
          -  EMDBGLOG("Host controller slot capabilities: 0x%llX", hostCaps);
          +  UInt8 cardType = _mmcExtendedCSD.deviceType;
          +  bool hostHS400 = ((hostCaps >> 63) & 1) != 0;   // Linux: CAP bit63 == HS400 support
          +  bool cardHS400 = (cardType & kMMCDeviceTypeHS400_DDR_1_8V) != 0;
          +  bool hostHS200 = (hostCaps & kSDHCRegCapabilitiesSRD104Supported) != 0;
          +
          +  EMDBGLOG("Host caps 0x%llX, card deviceType 0x%X, hostHS400 %u, cardHS400 %u",
          +           hostCaps, cardType, hostHS400, cardHS400);
           
             //
             // Determine DMA support level.
          @@ -559,17 +541,135 @@ bool EmeraldSDHCBlockStorageDevice::switchMMCSpeed() {
               EMDBGLOG("No DMA support, using PIO");
               _hcTransferType = kSDATransferTypePIO;
             }
          -  EMDBGLOG("No DMA support, using PIO");
             _cardSlot->setControllerDMAMode(_hcTransferType);
          -  
          +
          +  //
          +  // 8-bit bus is a prerequisite for both HS200 and HS400.
          +  //
          +  bool bus8 = setCardBusWidth(kSDABusWidth8, false);
          +  EMDBGLOG("8-bit SDR bus: %s", bus8 ? "OK" : "FAILED");
          +  if (!bus8) {
          +    setCardBusWidth(kSDABusWidth4, false);
          +  }
          +  SDABusWidth busWidth = bus8 ? kSDABusWidth8 : kSDABusWidth4;
          +
          +  //
          +  // Try HS400 first (8-bit DDR @ 200 MHz -> 400 MB/s theoretical).
          +  //
          +  if (bus8 && hostHS400 && cardHS400) {
          +    if (switchMMCHS400()) {
          +      setProperty("EmeraldSDHCTimingMode", "HS400");
          +      EMDBGLOG("HS400 established");
          +      goto done;
          +    }
          +    EMSYSLOG("HS400 failed, rolling back to HS200");
          +    _cardSlot->setControllerClock(kSDAInitSpeedClock400kHz);
          +    setMMCSpeed(kMMCTimingSpeedDefault);
          +    IOSleep(20);
          +    setCardBusWidth(kSDABusWidth8, false);
          +  }
          +
          +  //
          +  // HS200 fallback (8-bit SDR @ 200 MHz).
          +  //
          +  if (hostHS200 &&
          +      (cardType & (kMMCDeviceTypeHS200_SDR_1_8V | kMMCDeviceTypeHS200_SDR_1_2V))) {
          +    if (setMMCSpeed(kMMCTimingSpeedHS200) &&
          +        _cardSlot->setControllerClock(200 * MHz) &&
          +        tuneCard(busWidth) &&
          +        verifyMMCMode(kMMCTimingSpeedHS200)) {
          +      setProperty("EmeraldSDHCTimingMode", "HS200");
          +      EMDBGLOG("HS200 established");
          +      goto done;
          +    }
          +    EMSYSLOG("HS200 failed, falling back to HighSpeed");
          +    _cardSlot->setControllerClock(kSDAInitSpeedClock400kHz);
          +    setMMCSpeed(kMMCTimingSpeedDefault);
          +    IOSleep(20);
          +    setCardBusWidth(busWidth, false);
          +  }
          +
          +  //
          +  // Last resort: 52 MHz HighSpeed on the widest working bus.
          +  //
          +  if (!setMMCSpeed(kMMCTimingSpeedHighSpeed)) {
          +    setMMCSpeed(kMMCTimingSpeedDefault);
          +  }
          +  _cardSlot->setControllerClock(_mmcMaxStandardClock);
          +  setProperty("EmeraldSDHCTimingMode", "HighSpeed");
          +
          +done:
             memset(&_mmcExtendedCSD, 0, sizeof (_mmcExtendedCSD));
             parseMMCExtendedCSD();
           
          +  setProperty("MMCDeviceType", _mmcExtendedCSD.deviceType, 8);
          +  setProperty("MMCBusWidth", _mmcExtendedCSD.busWidth, 8);
          +  setProperty("MMCHsTiming", _mmcExtendedCSD.hsTiming & 0x0F, 8);
          +  setProperty("HostCapabilities", (UInt64)hostCaps, 64);
          +
             return true;
           }
           
          +bool EmeraldSDHCBlockStorageDevice::switchMMCHS400() {
          +  //
          +  // JEDEC HS400 entry sequence, mirrors Linux mmc_select_hs400():
          +  //   1. downgrade card to HS timing and drop the clock
          +  //   2. switch card to 8-bit DDR bus width (EXT_CSD BUS_WIDTH = 6)
          +  //   3. switch card to HS400 timing (EXT_CSD HS_TIMING = 3)
          +  //   4. raise clock to 200 MHz and put host into HS400 mode
          +  //   5. re-tune and verify
          +  //
          +  setProperty("HS400Stage", "1-downgrade-HS");
          +  if (!setMMCSpeed(kMMCTimingSpeedHighSpeed)) {
          +    EMSYSLOG("HS400: failed to switch card to HS timing");
          +    return false;
          +  }
          +  if (!_cardSlot->setControllerClock(_mmcMaxStandardClock)) {
          +    EMSYSLOG("HS400: failed to drop clock to HS speed");
          +    return false;
          +  }
          +  IOSleep(2);
          +
          +  setProperty("HS400Stage", "2-8bit-DDR");
          +  if (!setCardBusWidth(kSDABusWidth8, true)) {
          +    EMSYSLOG("HS400: failed to select 8-bit DDR bus");
          +    return false;
          +  }
          +  IOSleep(2);
          +
          +  setProperty("HS400Stage", "3-hs400-timing");
          +  if (!setMMCSpeed(kMMCTimingSpeedHS400)) {
          +    EMSYSLOG("HS400: failed to switch card to HS400 timing");
          +    return false;
          +  }
          +  IOSleep(2);
          +
          +  if (!_cardSlot->setControllerClock(200 * MHz)) {
          +    EMSYSLOG("HS400: failed to set 200 MHz");
          +    return false;
          +  }
          +  IOSleep(5);
          +
          +  setProperty("HS400Stage", "4-tuning");
          +  if (!tuneCard(kSDABusWidth8)) {
          +    EMSYSLOG("HS400: tuning failed");
          +    return false;
          +  }
          +
          +  return verifyMMCMode(kMMCTimingSpeedHS400);
          +}
          +
          +bool EmeraldSDHCBlockStorageDevice::verifyMMCMode(MMCTimingSpeed expected) {
          +  memset(&_mmcExtendedCSD, 0, sizeof (_mmcExtendedCSD));
          +  parseMMCExtendedCSD();
          +  UInt8 got = _mmcExtendedCSD.hsTiming & 0x0F;
          +  EMDBGLOG("Verify timing: expected %u actual %u busWidth 0x%X",
          +           (UInt8)expected, got, _mmcExtendedCSD.busWidth);
          +  return got == (UInt8)expected;
          +}
          +
           bool EmeraldSDHCBlockStorageDevice::tuneCard(SDABusWidth busWidth) {
          -  bool tuningComplete = true;
          +  bool tuningComplete = false;
           
             UInt16 bytesLength = 0;
             if (busWidth == kSDABusWidth4) {
          @@ -594,12 +694,19 @@ bool EmeraldSDHCBlockStorageDevice::tuneCard(SDABusWidth busWidth) {
             //
             EMDBGLOG("Starting tuning of card using %u bytes", bytesLength);
             _cardSlot->writeReg16(kSDHCRegHostControl2, _cardSlot->readReg16(kSDHCRegHostControl2) | kSDHCRegHostControl2ExecuteTuning);
          -  while (_cardSlot->readReg16(kSDHCRegHostControl2) & kSDHCRegHostControl2ExecuteTuning) {
          +  UInt32 tuningLoops = 0;
          +  while (tuningLoops < 40) {
          +    tuningLoops++;
               if (doSyncCommandWithData(kMMCCommandSendTuningBlock, 0, kSDATimeout_10sec, 1, bytesLength, bufDescriptor, 0) != kIOReturnSuccess) {
          -      tuningComplete = false;
          +      break;
          +    }
          +    UInt16 hc2 = _cardSlot->readReg16(kSDHCRegHostControl2);
          +    if ((hc2 & kSDHCRegHostControl2ExecuteTuning) == 0) {
          +      tuningComplete = (hc2 & kSDHCRegHostControl2SamplingClockSelect) != 0;
                 break;
               }
             }
          +  if (!tuningComplete) EMSYSLOG("Tuning did not converge after %u loops", tuningLoops);
             EMDBGLOG("Tuning complete: %u", tuningComplete); // TODO: handle tuning error interrupts?
           
             bufDescriptor->complete();
          diff --git a/EmeraldSDHC/EmeraldSDHCSlot.cpp b/EmeraldSDHC/EmeraldSDHCSlot.cpp
          index 5ceeb6b..15ddfe7 100644
          --- a/EmeraldSDHC/EmeraldSDHCSlot.cpp
          +++ b/EmeraldSDHC/EmeraldSDHCSlot.cpp
          @@ -214,17 +214,21 @@ bool EmeraldSDHCSlot::setControllerClock(UInt32 speedHz) {
             //
             // Calculate clock divisor.
             //
          -  UInt32 clockDiv;
          -  for (clockDiv = 1; (baseClock / clockDiv) > speedHz; clockDiv <<= 1);
          -  EMDBGLOG("Clock will be set to %u %s using divisor %u",
          -           speedHz >= MHz ? (baseClock / clockDiv) / MHz : (baseClock / clockDiv) / kHz,
          -           speedHz >= MHz ? "MHz" : "kHz", clockDiv);
          +  //
          +  // SDHCI: FREQ_SEL stores half of the real divisor (0 selects the base clock).
          +  // Writing the divisor directly halved the real SDCLK.
          +  //
          +  UInt32 clockDiv = 1;
          +  for (clockDiv = 1; clockDiv < 4096 && (baseClock / clockDiv) > speedHz; clockDiv <<= 1);
          +  UInt32 encodedClockDiv = clockDiv >> 1;
          +  EMDBGLOG("Clock request %u Hz -> actual %u Hz (divisor %u, encoded %u)",
          +           speedHz, baseClock / clockDiv, clockDiv, encodedClockDiv);
           
             //
             // Set clock divisor and start SD clock.
             //
          -  UInt16 newClockDiv = ((clockDiv << kSDHCRegClockControlFreqSelectLowShift) & kSDHCRegClockControlFreqSelectLowMask)
          -    | ((clockDiv >> kSDHCRegClockControlFreqSelectHighRhShift) & kSDHCRegClockControlFreqSelectHighMask);
          +  UInt16 newClockDiv = ((encodedClockDiv << kSDHCRegClockControlFreqSelectLowShift) & kSDHCRegClockControlFreqSelectLowMask)
          +    | ((encodedClockDiv >> kSDHCRegClockControlFreqSelectHighRhShift) & kSDHCRegClockControlFreqSelectHighMask);
             writeReg16(kSDHCRegClockControl, readReg16(kSDHCRegClockControl) | newClockDiv);
             writeReg16(kSDHCRegClockControl, readReg16(kSDHCRegClockControl) | kSDHCRegClockControlSDClockEnable);
             EMDBGLOG("Clock control register is now 0x%X", readReg16(kSDHCRegClockControl));
          diff --git a/EmeraldSDHC/SDRegs.hpp b/EmeraldSDHC/SDRegs.hpp
          index 589324a..1dc6acd 100644
          --- a/EmeraldSDHC/SDRegs.hpp
          +++ b/EmeraldSDHC/SDRegs.hpp
          @@ -171,6 +171,7 @@
           #define kSDHCRegCapabilitiesVoltage3_3Supported   BIT24
           #define kSDHCRegCapabilitiesVoltage3_0Supported   BIT25
           #define kSDHCRegCapabilitiesVoltage1_8Supported   BIT26
          +#define kSDHCRegCapabilitiesSRD104Supported        (1ULL << 33)
           #define kSDHCRegCapabilitiesSlotTypeEmbedded      BIT30
           
           #define kSDHCRegMaxCurrentCapabilities  0x48
          PATCH_EOF
          cd repo
          git apply -v /tmp/diag.diff

      - name: Verify patch applied to SOURCE
        run: |
          set -e
          grep -q 'switchMMCHS400' repo/EmeraldSDHC/EmeraldSDHCBlockStorageDeviceCard.cpp
          grep -q 'HostCapabilities' repo/EmeraldSDHC/EmeraldSDHCBlockStorageDeviceCard.cpp
          echo "SOURCE PATCH OK"

      - name: Build Debug
        run: |
          cd repo
          xcodebuild -project EmeraldSDHC.xcodeproj -scheme EmeraldSDHC -configuration Debug -derivedDataPath /tmp/dd CODE_SIGNING_ALLOWED=NO build

      - name: Verify patch present in BINARY
        run: |
          set -e
          BIN=$(find /tmp/dd -name EmeraldSDHC -type f -path '*MacOS*' | head -1)
          echo "BINARY: $BIN"
          if strings "$BIN" | grep -q 'MMCDeviceType'; then
            echo "BINARY PATCH OK"
          else
            echo "BINARY PATCH MISSING"
            exit 1
          fi
          shasum -a 256 "$BIN"

      - name: Package
        run: |
          set -e
          KEXT=$(find /tmp/dd -name 'EmeraldSDHC.kext' -maxdepth 8 | head -1)
          mkdir -p out
          cp -R "$KEXT" out/
          cd out
          zip -qry ../EmeraldSDHC-hs400diag.zip EmeraldSDHC.kext
          ls -l ../EmeraldSDHC-hs400diag.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EmeraldSDHC-diag
          path: EmeraldSDHC-hs400diag.zip

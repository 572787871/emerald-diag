name: Build EmeraldSDHC (ioreg diagnostics)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Fetch sources
        run: |
          git clone --depth 1 https://github.com/acidanthera/EmeraldSDHC.git repo
          git clone --depth 1 https://github.com/acidanthera/MacKernelSDK.git repo/MacKernelSDK

      - name: Apply diagnostics patch
        run: |
          cat > /tmp/diag.diff <<'PATCH_EOF'
          diff --git a/EmeraldSDHC/EmeraldSDHCBlockStorageDeviceCard.cpp b/EmeraldSDHC/EmeraldSDHCBlockStorageDeviceCard.cpp
          index c420ea4..8e635e8 100644
          --- a/EmeraldSDHC/EmeraldSDHCBlockStorageDeviceCard.cpp
          +++ b/EmeraldSDHC/EmeraldSDHCBlockStorageDeviceCard.cpp
          @@ -565,6 +565,16 @@ bool EmeraldSDHCBlockStorageDevice::switchMMCSpeed() {
             memset(&_mmcExtendedCSD, 0, sizeof (_mmcExtendedCSD));
             parseMMCExtendedCSD();
           
          +  //
          +  // DIAGNOSTIC: expose negotiated MMC state via the IORegistry.
          +  //
          +  setProperty("MMCDeviceType", _mmcExtendedCSD.deviceType, 8);
          +  setProperty("MMCBusWidth", _mmcExtendedCSD.busWidth, 8);
          +  setProperty("MMCHsTiming", _mmcExtendedCSD.hsTiming & 0x0F, 8);
          +  setProperty("MMCPowerClass", _mmcExtendedCSD.powerClass, 8);
          +  setProperty("MMCDriverStrength", _mmcExtendedCSD.driverStrength, 8);
          +  setProperty("HostCapabilities", (UInt64)hostCaps, 64);
          +
             return true;
           }
           
          diff --git a/EmeraldSDHC/EmeraldSDHCSlot.cpp b/EmeraldSDHC/EmeraldSDHCSlot.cpp
          index 5ceeb6b..5eca810 100644
          --- a/EmeraldSDHC/EmeraldSDHCSlot.cpp
          +++ b/EmeraldSDHC/EmeraldSDHCSlot.cpp
          @@ -214,17 +214,21 @@ bool EmeraldSDHCSlot::setControllerClock(UInt32 speedHz) {
             //
             // Calculate clock divisor.
             //
          -  UInt32 clockDiv;
          -  for (clockDiv = 1; (baseClock / clockDiv) > speedHz; clockDiv <<= 1);
          -  EMDBGLOG("Clock will be set to %u %s using divisor %u",
          -           speedHz >= MHz ? (baseClock / clockDiv) / MHz : (baseClock / clockDiv) / kHz,
          -           speedHz >= MHz ? "MHz" : "kHz", clockDiv);
          +  //
          +  // SDHCI: FREQ_SEL stores half of the real divisor (N=0 means base clock).
          +  // The original code wrote the divisor directly, halving the real SDCLK.
          +  //
          +  UInt32 clockDiv = 1;
          +  for (clockDiv = 1; clockDiv < 4096 && (baseClock / clockDiv) > speedHz; clockDiv <<= 1);
          +  UInt32 encodedClockDiv = clockDiv >> 1;
          +  EMDBGLOG("Clock request %u Hz -> actual %u Hz (divisor %u, encoded %u)",
          +           speedHz, baseClock / clockDiv, clockDiv, encodedClockDiv);
           
             //
             // Set clock divisor and start SD clock.
             //
          -  UInt16 newClockDiv = ((clockDiv << kSDHCRegClockControlFreqSelectLowShift) & kSDHCRegClockControlFreqSelectLowMask)
          -    | ((clockDiv >> kSDHCRegClockControlFreqSelectHighRhShift) & kSDHCRegClockControlFreqSelectHighMask);
          +  UInt16 newClockDiv = ((encodedClockDiv << kSDHCRegClockControlFreqSelectLowShift) & kSDHCRegClockControlFreqSelectLowMask)
          +    | ((encodedClockDiv >> kSDHCRegClockControlFreqSelectHighRhShift) & kSDHCRegClockControlFreqSelectHighMask);
             writeReg16(kSDHCRegClockControl, readReg16(kSDHCRegClockControl) | newClockDiv);
             writeReg16(kSDHCRegClockControl, readReg16(kSDHCRegClockControl) | kSDHCRegClockControlSDClockEnable);
             EMDBGLOG("Clock control register is now 0x%X", readReg16(kSDHCRegClockControl));
          PATCH_EOF
          cd repo
          git apply -v /tmp/diag.diff

      - name: Verify patch applied to SOURCE
        run: |
          set -e
          grep -q 'MMCDeviceType' repo/EmeraldSDHC/EmeraldSDHCBlockStorageDeviceCard.cpp
          grep -q 'HostCapabilities' repo/EmeraldSDHC/EmeraldSDHCBlockStorageDeviceCard.cpp
          echo "SOURCE PATCH OK"

      - name: Build Debug
        run: |
          cd repo
          xcodebuild -project EmeraldSDHC.xcodeproj -scheme EmeraldSDHC -configuration Debug -derivedDataPath /tmp/dd CODE_SIGNING_ALLOWED=NO build

      - name: Verify patch present in BINARY
        run: |
          set -e
          BIN=$(find /tmp/dd -name EmeraldSDHC -type f -path '*MacOS*' | head -1)
          echo "BINARY: $BIN"
          if strings "$BIN" | grep -q 'MMCDeviceType'; then
            echo "BINARY PATCH OK"
          else
            echo "BINARY PATCH MISSING"
            exit 1
          fi
          shasum -a 256 "$BIN"

      - name: Package
        run: |
          set -e
          KEXT=$(find /tmp/dd -name 'EmeraldSDHC.kext' -maxdepth 8 | head -1)
          mkdir -p out
          cp -R "$KEXT" out/
          cd out
          zip -qry ../EmeraldSDHC-clockfix.zip EmeraldSDHC.kext
          ls -l ../EmeraldSDHC-clockfix.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EmeraldSDHC-diag
          path: EmeraldSDHC-clockfix.zip
